    label: USB 5 V supply
    kind: power
    group: power
    dimensions: [28, 14, 22]
    position: [-88, 8, 0]
    schematic: [70, 95]
    pins:
      - { id: VBUS, label: '5 V', side: right, voltage: 5, position: [14, 2, -4] }
      - { id: GND, side: right, voltage: 0, position: [14, 2, 4] }
    notes: VBUS and GND represent the USB cable conductors, not a second supply into VIN while USB is attached.
    purchase: { url: 'https://www.aliexpress.com/w/wholesale-usb-5v-2a-power-supply.html', label: Supplier search }

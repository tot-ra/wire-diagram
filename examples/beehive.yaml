    purchase: { url: 'https://www.aliexpress.com/w/wholesale-ds18b20-waterproof.html', label: Supplier search }
wires:
  - { id: usb-power, from: usb.VBUS, to: esp.VIN, color: '#cf3740', label: USB 5 V, voltage: 5, lengthMm: 200, diameterMm: 1.6 }
  - { id: usb-ground, from: usb.GND, to: esp.GND, color: '#243139', voltage: 0 }
  - { id: hx-power, from: esp.3V3, to: hx.VCC, color: '#cf3740', voltage: 3.3, dashed: true, net: 3V3 }
  - { id: hx-ground, from: esp.GND, to: hx.GND, color: '#243139', voltage: 0, net: GND }
  - { id: hx-data, from: esp.IO16, to: hx.DT, color: '#e78924', label: DT, lengthMm: 150, gaugeAwg: 26 }
  - { id: hx-clock, from: esp.IO17, to: hx.SCK, color: '#2578c4', label: SCK, lengthMm: 150, gaugeAwg: 26 }
  - { id: load-excite-plus, from: hx.E+, to: load.E+, color: '#cf3740' }
  - { id: load-excite-minus, from: hx.E-, to: load.E-, color: '#243139' }
  - { id: load-signal-plus, from: hx.A+, to: load.A+, color: '#b0b8ba', notes: White conductor. Shown gray in 2D for contrast. }
  - { id: load-signal-minus, from: hx.A-, to: load.A-, color: '#328d57' }
  - { id: probe-power, from: esp.3V3, to: probe.VDD, color: '#cf3740', voltage: 3.3, dashed: true, net: 3V3 }
  - { id: pullup-power, from: esp.3V3, to: pullup.VCC, color: '#cf3740', voltage: 3.3, dashed: true, net: 3V3 }
  - { id: probe-data, from: esp.IO4, to: pullup.DQ, color: '#855c46', net: DQ }
  - { id: probe-data-tail, from: pullup.DQ, to: probe.DQ, color: '#855c46', label: DQ, net: DQ }
  - { id: probe-ground, from: esp.GND, to: probe.GND, color: '#243139', voltage: 0, net: GND }

version: 1
title: Beehive sensor bench
description: ESP32 + weight and temperature sensing · low-voltage lab reference
notes:
  - Disconnect USB before changing wires. All modules share ground.
  - This demo powers HX711 from 3.3 V. Verify supply requirements and DT logic voltage on your exact module; ESP32 GPIO is not 5 V tolerant.
  - The 4.7 kΩ resistor joins 3.3 V to DQ. Never connect DQ directly to the power rail.
  - Component sizes and pin anchors are illustrative. Match printed pin labels, not board orientation or cable colors alone.
groups:
  - { id: power, label: USB POWER, color: '#5c9fb5' }
  - { id: control, label: CONTROLLER, color: '#d2a454' }
  - { id: weight, label: WEIGHT CHAIN, color: '#64a888' }
  - { id: temp, label: TEMPERATURE CHAIN, color: '#b681a5' }
components:

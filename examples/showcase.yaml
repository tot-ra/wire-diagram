version: 1
title: Built-in 3D model gallery
description: Built-in 3D silhouettes shipped with wire-diagram · Raspberry Pi shown as four board versions
notes:
  - Open the 3D view to browse every built-in model. Schematic layout is a catalog; wires are minimal demos only.
  - Models are approximate lab silhouettes, not verified manufacturing CAD.
  - Waterproof DS18B20 stays kind probe; kind ds18b20 is the 3-pin AliExpress PCB module.
